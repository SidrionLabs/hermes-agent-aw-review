name: AW-043 combined Linux default runtime

on:
  push:
    branches: [review/aw043-combined-runtime-ci]
    paths:
      - .github/workflows/aw043-linux-combined-runtime.yml
      - scripts/ci/aw043_linux_combined_runtime.py

permissions:
  contents: read

concurrency:
  group: aw043-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    if: github.repository == 'SidrionLabs/hermes-agent-aw-review'
    name: Native default runtime (${{ matrix.slice }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      HERMES_TEST_FILE_RETRIES: '0'
      HERMES_TEST_SLICE: ${{ matrix.slice }}/8
      HERMES_TEST_WORKERS: '2'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
    steps:
      - name: Checkout review infrastructure
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: 2581a6325da28288b471d8c83b0d9e35f173ab12
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Provision upstream pinned ripgrep
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/aw043-ripgrep"
          mkdir -p "$target"
          archive="$target/ripgrep.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" \\
            https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$target"
          echo "$target/ripgrep-15.1.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Prepare native pinned isolated test environment
        uses: ./candidate/.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "messaging"]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
      - name: Verify one native default runtime slice
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/aw043_linux_combined_runtime.py" "$GITHUB_WORKSPACE/candidate"
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aw043-runtime-${{ github.run_id }}-${{ github.run_attempt }}-slice-${{ matrix.slice }}
          path: ${{ runner.temp }}/aw043-runtime-evidence
          if-no-files-found: warn
          retention-days: 30
