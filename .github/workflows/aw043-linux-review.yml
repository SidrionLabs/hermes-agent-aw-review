name: AW-043 frozen Linux review

on:
  push:
    branches: [review/aw043-linux-ci]
    paths:
      - .github/workflows/aw043-linux-review.yml
      - scripts/ci/aw043_linux_review.py

permissions:
  contents: read

concurrency:
  group: aw043-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kanban:
    if: github.repository == 'SidrionLabs/hermes-agent-aw-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      HERMES_TEST_FILE_RETRIES: '0'
      HERMES_TEST_WORKERS: '2'
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      NOUS_API_KEY: ''
    steps:
      - name: Checkout review infrastructure
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: e12235075953429b853c4957af868b6d6a02cd0a
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare native pinned isolated test environment
        uses: ./candidate/.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
      - name: Verify Linux behavior and remaining gates
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/aw043_linux_review.py" "$GITHUB_WORKSPACE/candidate"
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aw043-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aw043-linux-evidence
          if-no-files-found: warn
          retention-days: 30
